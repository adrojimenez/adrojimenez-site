<style>
/* The design commits to one light look, so the page ignores the viewer's dark mode.
   Layout: a calm rounded panel for the hero, then a bento grid of projects that re-compose on hover.
   Palette: cream, deep green, moss and mint, with pink reserved for calls to action. Type: Geist, light and tightly set for the display sizes. */
:root {
  --bg: #F2EFEA;
  --surface: #E9E5DD;
  --line: #CFCABF;
  --ink: #1A2B07;
  --muted: #55604A;
  --olive: #1B3206;
  --olive-on: #F2EFEA;
  --mint: #65D87B;
  --pink: #FFBFD9;
  --deep: #1B3206;
  --cream: #F2EFEA;
  --paper: #E1DCCF;
  --art-a: #E9E5DD;
  --art-b: #E1DCCF;
  --moss: #55604A;
  --olive-soft: #65D87B;
  --font-display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Geist", "Helvetica Neue", Arial, sans-serif;
  --radius-tile: 20px;
  --radius-ui: 999px;
  --gap: 12px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-text); font-size: 17px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--olive); outline-offset: 3px; border-radius: 6px; }
#main:focus, #pageTitle:focus, .page h1:focus { outline: none; }
.skip { position: absolute; left: 16px; top: -60px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; }
.skip:focus { top: 12px; }

.wrap {
  max-width: 1240px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* Header */
.site-header { border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.brand { white-space: nowrap; font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; letter-spacing: -0.01em; text-decoration: none; }
.nav { display: flex; gap: 6px; }
.nav a {
  text-decoration: none; padding: 8px 16px; border-radius: var(--radius-ui);
  font-size: 0.95rem; font-weight: 500; color: var(--muted);
}
.nav a:hover { color: var(--ink); background: var(--surface); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface); }
@media (max-width: 520px) {
  .site-header .wrap { gap: 8px; }
  .brand { font-size: 1.05rem; }
  .nav { gap: 0; }
  .nav a { padding: 8px 10px; font-size: .9rem; }
}

/* Hero */
.hero {
  margin: 20px 0 var(--gap); padding: clamp(24px, 5vw, 64px); background: var(--surface); border-radius: 28px;
  min-height: clamp(300px, 36vw, 440px); display: flex; flex-direction: column; justify-content: flex-end; gap: 16px;
}
.hero h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.5rem, 7.2vw, 5.75rem); line-height: 0.98; letter-spacing: -0.045em;
  max-width: 14ch; text-wrap: balance;
}
.hero p { margin: 0; max-width: 52ch; color: var(--muted); font-size: clamp(1.05rem, 1.6vw, 1.2rem); }
.hero .role-line { color: var(--ink); font-weight: 500; font-size: clamp(1rem, 1.5vw, 1.15rem); }

/* Bento grid */
.grid {
  display: grid; gap: var(--gap);
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: 88px;
  padding-bottom: clamp(48px, 7vw, 96px);
}
.tile {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  border-radius: var(--radius-tile); overflow: hidden; background: var(--surface);
  text-decoration: none; isolation: isolate;
}
.tile.s-a { grid-column: span 7; grid-row: span 5; }
.tile.s-b { grid-column: span 5; grid-row: span 5; }
.tile.s-c { grid-column: span 4; grid-row: span 4; }
.tile.s-d { grid-column: span 4; grid-row: span 3; }
.tile.s-e { grid-column: span 6; grid-row: span 3; }
.tile.s-f { grid-column: span 6; grid-row: span 4; }
@media (max-width: 899px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 78px; }
  .tile.s-a, .tile.s-b, .tile.s-f { grid-column: span 2; grid-row: span 4; }
  .tile.s-c, .tile.s-d, .tile.s-e { grid-column: span 1; grid-row: span 3; }
}
@media (max-width: 520px) {
  .tile.s-c, .tile.s-d, .tile.s-e { grid-column: span 2; grid-row: span 3; }
}
.art { position: relative; flex: 1; min-height: 0; container-type: size; overflow: hidden; }
.frame {
  position: absolute; inset: 0; opacity: 0; transform: translateY(7%) scale(1.04); filter: blur(12px);
  transition: opacity .5s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1), filter .5s cubic-bezier(.2,.7,.2,1);
}
.frame.on { opacity: 1; transform: none; filter: none; }
.tile .art .frame { opacity: 1; filter: none; transform: scale(1); transition: transform .7s cubic-bezier(.2,.7,.2,1); will-change: transform; }
@media (hover: hover) { .tile:hover .art .frame, .tile:focus-visible .art .frame { transform: scale(1.04); } }
.cap { padding: 14px 18px 16px; background: var(--surface); }
.cap-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.cap p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.4; max-width: 60ch; }
.cap h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; letter-spacing: -0.01em; line-height: 1.2; }
.cap span { font-size: 0.85rem; color: var(--muted); text-align: right; }
.tile:hover .cap h2, .tile:focus-visible .cap h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* Frame compositions */
.f-blocks { display: grid; gap: 0; }
.f-blocks i { display: block; }
.f-mark { display: grid; place-items: center; background: var(--art-a); }
.f-mark b {
  font-family: var(--font-display); font-weight: 400; letter-spacing: -0.045em; line-height: 1;
  font-size: clamp(2rem, 20cqw, 7rem); color: var(--deep); text-align: center; padding: 0 6%;
}
.f-pattern { background-color: var(--art-a); }

/* Pages */
.page { padding-bottom: clamp(48px, 7vw, 96px); }
.back { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 14px 8px 10px; border-radius: var(--radius-ui); text-decoration: none; color: var(--muted); font-weight: 500; font-size: .95rem; }
.back:hover { background: var(--surface); color: var(--ink); }
.page h1 {
  margin: 28px 0 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.2rem, 6vw, 4.5rem); line-height: 1; letter-spacing: -0.03em; text-wrap: balance; max-width: 18ch;
}
.lede { max-width: 58ch; margin: 18px 0 0; color: var(--muted); font-size: 1.15rem; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px 32px; margin: 36px 0; padding-block: 22px; border-block: 1px solid var(--line); }
.meta dt { font-size: .85rem; color: var(--muted); }
.meta dd { margin: 2px 0 0; font-weight: 500; }
.hero-art { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius-tile); overflow: hidden; container-type: size; }
.hero-art .frame { opacity: 1; transform: none; filter: none; }
.cs { display: grid; gap: 28px; margin-block: 56px; }
.cs section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 800px) { .cs section { grid-template-columns: 220px minmax(0, 1fr); gap: 32px; } }
.cs h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; letter-spacing: -0.01em; }
.cs p { margin: 0; max-width: 62ch; }
.prose { display: grid; gap: 14px; }
.f-img img, .hero-art > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero-art > img { position: absolute; inset: 0; }
.gal { display: grid; gap: var(--gap); grid-template-columns: repeat(12, minmax(0, 1fr)); margin-top: var(--gap); }
.gal figure { position: relative; margin: 0; grid-column: span var(--mspan, 12); aspect-ratio: var(--ratio, 16 / 9); border-radius: var(--radius-tile); overflow: hidden; background: #0d0d0d; }
.gal img, .gal video { display: block; width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 700px) { .gal figure { grid-column: span var(--span, 12); } .gal figure.fill { aspect-ratio: auto; align-self: stretch; } .gal figure.fill img { position: absolute; inset: 0; } }
.vid-btn { position: absolute; left: 12px; bottom: 12px; padding: 6px 14px; border-radius: var(--radius-ui); border: 0; background: var(--cream); color: var(--deep); font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; }
.vid-btn:hover { background: var(--mint); }
.marq { grid-column: span 12; display: grid; gap: 10px; }
.marq-viewport { overflow: hidden; border-radius: var(--radius-tile); }
.marq-track { display: flex; width: max-content; animation: marq-slide 60s linear infinite; }
.marq-group { display: flex; gap: var(--gap); margin: 0; padding: 0 var(--gap) 0 0; list-style: none; }
.marq .m.stat { flex: 0 0 auto; grid-column: auto; width: clamp(210px, 62vw, 260px); min-height: 170px; }
.marq:hover .marq-track, .marq:focus-within .marq-track, .marq.paused .marq-track { animation-play-state: paused; }
@keyframes marq-slide { to { transform: translateX(-50%); } }
.marq-btn { justify-self: start; padding: 6px 16px; border-radius: var(--radius-ui); border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; }
.marq-btn:hover { background: var(--surface); color: var(--ink); }
@media (prefers-reduced-motion: reduce) {
  .marq-track { animation: none; }
  .marq-viewport { overflow-x: auto; scroll-snap-type: x proximity; }
  .marq-group[aria-hidden] { display: none; }
  .marq .m.stat { scroll-snap-align: start; }
  .marq-btn { display: none; }
}
.nums { display: grid; gap: var(--gap); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.nums > .m.stat { grid-column: auto; min-height: 140px; padding: 20px; }
.nums .n { font-size: clamp(1.8rem, 3.4vw, 2.6rem); }
@media (min-width: 700px) { .nums { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cs .chips li { background: var(--surface); }
.facts { margin: 0; display: grid; gap: 0; max-width: 62ch; }
.facts > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding-block: 12px; border-top: 1px solid var(--line); }
.facts > div:last-child { border-bottom: 1px solid var(--line); }
.facts dt { font-size: .85rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }
@media (min-width: 600px) { .facts > div { grid-template-columns: 150px minmax(0, 1fr); gap: 24px; } }
.todo { color: var(--muted); font-style: italic; }
.shots { display: grid; gap: var(--gap); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.shots .shot { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-tile); overflow: hidden; container-type: size; }
.shots .shot.wide { grid-column: span 2; aspect-ratio: 21 / 9; }
.shots .frame { opacity: 1; transform: none; filter: none; }
.note { margin-top: 20px; padding: 14px 18px; border-radius: 12px; background: var(--surface); color: var(--muted); font-size: .92rem; max-width: 62ch; }
.next { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 56px; padding: 22px 26px; border-radius: var(--radius-tile); background: var(--surface); text-decoration: none; }
.next:hover strong { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.next small { display: block; color: var(--muted); font-size: .85rem; }
.next strong { font-family: var(--font-display); font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; }

/* About: mosaic */
.mosaic { display: grid; gap: var(--gap); grid-template-columns: repeat(12, minmax(0, 1fr)); margin-top: 40px; }
.m { grid-column: span 12; min-width: 0; background: var(--surface); border-radius: var(--radius-tile); padding: 24px; }
.m h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; letter-spacing: -0.015em; line-height: 1.2; }
.m .sub { margin: 4px 0 14px; color: var(--muted); font-size: .92rem; }
.m p { margin: 0; }
.pts { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: .97rem; }
.m.stat { grid-column: span 6; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 150px; }
.stat .n { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 5vw, 3.5rem); letter-spacing: -0.04em; line-height: 1; }
.stat .t { margin-top: 8px; color: var(--muted); font-size: .92rem; line-height: 1.35; }
.m.mint { background: var(--mint); color: var(--deep); }
.m.moss { background: var(--moss); color: var(--cream); }
.m.dark { background: var(--deep); color: var(--cream); }
.m.mint .t { color: var(--deep); }
.m.moss .t, .m.dark .t { color: var(--cream); }
.band { --band-pad: clamp(24px, 4vw, 56px); padding-block: var(--band-pad); border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.about-hero { position: relative; display: grid; gap: 28px; align-items: center; }
.about-hero h1 { margin: 0; max-width: none; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.5rem); line-height: 1; letter-spacing: -0.045em; text-wrap: balance; }
.about-hero .role-line { margin: 0 0 14px; font-weight: 500; font-size: 1.1rem; }
.about-hero .lede { margin: 22px 0 8px; }
.about-hero figure { margin: 0; }
.about-hero img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 22%; border-radius: 28px; }
@media (min-width: 900px) {
  .about-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; }
  .about-hero::before { content: ""; position: absolute; left: 50%; top: calc(-1 * var(--band-pad)); bottom: calc(-1 * var(--band-pad)); width: 1px; background: var(--line); }
}
.m.olive { background: var(--mint); color: var(--deep); }
.m.olive .sub { color: inherit; }
.m.olive .btn { background: var(--deep); color: var(--cream); }
.groups { margin: 0; display: grid; gap: 14px; }
.groups dt { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.groups dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.chips li { padding: 6px 12px; border-radius: var(--radius-ui); background: var(--bg); font-size: .9rem; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: .97rem; }
.plain span { display: block; color: var(--muted); font-size: .88rem; }
.btn { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: var(--radius-ui); background: var(--olive); color: var(--olive-on); text-decoration: none; font-weight: 500; }
.btn:hover { filter: brightness(1.08); }
.btn-pink { background: var(--pink); color: var(--deep); border: 2px solid var(--deep); padding: 10px 22px; }
.btn-pink:hover { filter: none; background: var(--mint); }
@media (min-width: 900px) {
  .m.c3 { grid-column: span 3; } .m.c4 { grid-column: span 4; } .m.c5 { grid-column: span 5; }
  .m.c7 { grid-column: span 7; } .m.c8 { grid-column: span 8; }
}

/* Footer */
.site-footer { border-top: 1px solid var(--line); }
.site-footer .wrap { display: grid; gap: 0; padding-block: 0; }
.site-footer .wrap > div { padding-block: 40px; }
@media (min-width: 800px) {
  .site-footer .wrap { grid-template-columns: 1.4fr 1fr 1fr; }
  .site-footer .wrap > div { padding-block: 48px 56px; }
  .site-footer .wrap > div + div { border-left: 1px solid var(--line); padding-left: 32px; }
}
.site-footer h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.05; max-width: 14ch; }
.site-footer p { margin: 0; color: var(--muted); }
.site-footer .lbl { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.site-footer a { text-underline-offset: 3px; }
.site-footer .sel { user-select: all; font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .frame, .tile .art .frame { transition: none; }
  .tile:hover .art .frame, .tile:focus-visible .art .frame { transform: none; }
}
</style>
</head>

  function projectHTML(p, i) {

      '<svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>';

        '<button type="button" class="marq-btn" id="marqBtn" aria-pressed="false">Pause</button></section>';
    }
    return '<div class="band"><div class="wrap"><div class="about-hero"><div class="ah-text"><p class="role-line">Lead Visual Designer</p><h1 id="pageTitle" tabindex="-1">Adrián Jiménez</h1>' +
      '<p class="lede">Creative leader with 15+ years across agencies, two studios co-founded, and Deloitte. I turn business priorities into clear creative direction and visual design, conceptualizing with managers and strategists and leading teams and stakeholders to deliver high-visibility work for US clients. I develop other designers through mentoring and communities that raise the quality of the work. Bilingual in English and Spanish.</p>' +
      '<a class="btn btn-pink" href="Adrian-Jimenez-CV.pdf">Download resume (PDF)</a></div>' +
      '<figure><img src="images/adrian.jpg" alt="Portrait of Adrián Jiménez" width="1184" height="1480"></figure></div></div></div>' +
      '<div class="wrap page"><div class="mosaic">' +
      marqueeHTML() +

      '<div class="m c7"><h2>Deloitte</h2><p class="sub">Senior Graphic Designer, Consulting · Jun 2025 to present</p>' + pts([
        'Lead designer on my teams, trusted with complex, high-visibility, time-sensitive projects. I partner with managers from the earliest stage to shape the concepts behind work that has proven successful for the account.',
        'Co-developed Human Capital’s visual identity end to end with its manager, from concept to brand guidelines and rollout across d.com, social and events, as part of a creative team spanning three countries. With no budget or time for a photo shoot, I built an AI-assisted image workflow (Adobe Firefly, Claude, Marketing Workbench, Sidekick) that iterated from real photography and produced much of its imagery.',
        'Owned the HR Tech booth, one of the area’s most important events: 1,500 sq ft with a podcast room, demo station, speaker stage and personalized merch station, 7,000 visitors, and 3 d.com page launches in parallel. Took it from concept to print-ready assets, aligning strategic marketers, event planners, account managers and creatives, and delivering assets to a US production vendor.',
        'Rewards &amp; Recognitions: Applause Award and Spot Award for Outstanding Value to Clients, from Consulting’s Creative Director and the US CMO, for Human Capital and Applied AI work, plus multiple Shout Outs. Snapshot feedback from managers, account managers and strategic marketers averages at the top of the scale.'
      ]) + '</div>' +
      '<div class="m c5"><h2>Wondersauce</h2><p class="sub">Lead Designer · Aug 2024 to Jun 2025<br>Senior Production Designer · Jan 2021 to Jul 2024</p>' + pts([
        'Led creative delivery for DRiV, a US client with 13 vehicle parts brands, directing 7 to 9 designers and animators across social, web, Amazon and editorial content.',
        'Co-led with the Creative Director the long-overdue refresh of 7 of the brands, conceptualizing the redesigns and directing the team’s proposals.',
        'Aligned expectations and timelines in daily stand-ups with 3 project managers and the Creative Director, and partnered with the Creative Director on DRiV’s internal web pages and the overall look and feel of the brands.',
        'Trusted with creative latitude on the premium Chandon account, designing high-end email, social and web.'
      ]) + '</div>' +

      '<div class="m c4"><h2>Tresunotres</h2><p class="sub">Co-founder, Brand Strategy and Design · 2021 to 2025</p>' + pts([
        'Co-ran a two-person branding studio with 20+ projects delivered, from quoting to final delivery of materials, leading concept development and client presentations on strategy-first branding.',
        'Worked with brands from small entrepreneurs to regional companies in redesign processes, across many categories.',
        'Delivered the full branding process on every project, from strategy and concept to brand identity, guidelines and brand books.'
      ]) + '</div>' +
      '<div class="m c4"><h2>Fokus</h2><p class="sub">Co-founder and Chief Creative Officer · 2016 to 2021</p>' + pts([
        'Co-founded the studio and evolved it from audiovisual production into branding and content, managing budgets, logistics and locations as a founding partner.',
        'Co-created Exploring, a travel series on Costa Rica, to build the studio’s reel from zero. The pilot sold to the Costa Rican Tourism Board (ICT), which manages the Essential Costa Rica country brand, and two seasons followed, bringing the studio’s first clients.',
        'Led all branding projects, directing junior and mid-level designers from concept to delivery, and integrated brand strategy into audiovisual production.',
        'Co-directed production crews of up to 20 people on commercials. As art director, led the creative process and created the visual world for commercials, music videos and branded content, and wrote scripts for some productions.'
      ]) + '</div>' +
      '<div class="m c4"><h2>Earlier experience</h2><p class="sub">Advertising agencies</p><ul class="plain">' +
        '<li>FCB San José<span>Lead Designer · 2014 to 2016</span><span>Supported the Art Director and mentored junior and mid designers on regional accounts, campaign key visuals and brand identity projects.</span></li>' +
        '<li>House Rapp<span>Senior Designer · 2013 to 2014</span><span>Key regional accounts: concepts, key visuals and digital materials.</span></li>' +
        '<li>McCann Worldgroup<span>Mid Designer · 2012 to 2013</span><span>Gollo, Costa Rica’s leading retail brand: concepts, key visuals and in-store materials.</span></li>' +
        '<li>Halsband Worldwide Partners<span>Junior Designer · 2010 to 2012</span><span>Right hand to the Art Director and CCO on key visuals and campaigns across industries.</span></li></ul></div>' +

      '<div class="m c4"><h2>Community and mentoring</h2><p class="sub">Developing designers and teams</p>' + pts([
        'Guided UI designers on d.com pages.',
        'Mentored a junior designer from Deloitte’s SHINE internship program.',
        'Buddy to an L35 new hire on Brand Strategy.',
        'Co-created the Design Sessions, which position Costa Rica’s designers as trusted experts for the firm.',
        'Member of the Local Community team organizing events for BM&amp;C.'
      ]) + '</div>' +
      '<div class="m c8"><h2>Skills and tools</h2><p class="sub">What I bring to a team</p><dl class="groups">' +
        '<div><dt>Leadership</dt><dd>' + chips(['Team leadership','Design review','Mentoring','Stakeholder management','Client presentations']) + '</dd></div>' +
        '<div><dt>Creative</dt><dd>' + chips(['Brand strategy','Visual identity','Art direction','Conceptualization and copywriting','Packaging','Editorial design','Photo manipulation','UI/UX design']) + '</dd></div>' +
        '<div><dt>Process</dt><dd>' + chips(['Agile','Workfront','Cross-channel campaign delivery']) + '</dd></div>' +
        '<div><dt>Tools</dt><dd>' + chips(['Adobe Creative Suite','Figma','Sketch','Microsoft Office','Adobe Firefly','Claude','Marketing Workbench','Sidekick']) + '</dd></div></dl></div>' +

      '<div class="m c5"><h2>Education and courses</h2><p class="sub">Degree and ongoing training</p><ul class="plain">' +
        '<li>Bachelor in Advertising Design<span>Universidad de las Ciencias y el Arte · 2006 to 2009</span></li>' +
        '<li>English<span>Universidad de Costa Rica · 2005 to 2007</span></li>' +
        '<li>Copywriting and Conceptualization; Creative Direction<span>Animal Ad School · 2012 to 2013</span></li></ul></div>' +
      '<div class="m c4"><h2>Awards and recognition</h2><p class="sub">Creative work, recognized</p><ul class="plain">' +
        '<li>Applause Award and Spot Award<span>Deloitte, for Outstanding Value to Clients</span></li>' +
        '<li>Silver Effie · 2013<span>With my team at McCann</span></li>' +
        '<li>Bronze at CR Festival Volcán · 2014<span>Costa Rica’s creativity festival. Developed with my copywriter partner from concept to final execution, led by the CCO and art director, at House Rapp</span></li></ul></div>' +
      '<div class="m c3"><h2>Languages</h2><p class="sub">Bilingual</p>' + chips(['English','Spanish']) + '</div>' +
      '<div class="m c4 olive"><h2>Resume</h2><p class="sub">My resume as a PDF.</p><a class="btn" href="Adrian-Jimenez-CV.pdf">Download resume (PDF)</a></div>' +
      '<div class="m c8"><h2>How this site is built</h2><p class="sub">The same care I bring to client work</p><p>I art-directed this site and built it with AI, using Claude with GitHub and Vercel, and I also work with ChatGPT and Gemini. Text meets AA contrast, every project opens from a keyboard-reachable link, focus is always visible, and the tile animations pause for anyone who prefers reduced motion.</p></div>' +
      '</div></div>';
  }

  var main = document.getElementById('main');
  var timers = [], observers = [];

  function stopAll() {
    timers.forEach(clearInterval); timers = [];
    observers.forEach(function (o) { o.disconnect(); }); observers = [];
  }

  function wireTiles() {}

  function render(first) {
    stopAll();
    var h = location.hash.slice(1), key = 'home';
    if (h.indexOf('work-') === 0) {
      var slug = h.slice(5), i = PROJECTS.findIndex(function (p) { return p.slug === slug; });
      if (i > -1) { main.innerHTML = projectHTML(PROJECTS[i], i); key = 'work'; document.title = PROJECTS[i].title + ' | Adrián Jiménez'; }
      else { main.innerHTML = homeHTML(); document.title = 'Adrián Jiménez'; }
    } else if (h === 'about') {
      main.innerHTML = aboutHTML(); key = 'about'; document.title = 'About | Adrián Jiménez';
    } else {
      main.innerHTML = homeHTML(); document.title = 'Adrián Jiménez';
    }
    document.querySelectorAll('.nav a[data-key]').forEach(function (a) {
      var on = a.dataset.key === key || (key === 'work' && a.dataset.key === 'home');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    wireTiles();
    document.querySelectorAll('video[data-loop]').forEach(function (v) {
      var btn = v.parentNode.querySelector('.vid-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function label() { btn.textContent = v.paused ? 'Play' : 'Pause'; btn.setAttribute('aria-label', v.paused ? 'Play animation' : 'Pause animation'); }
      if (reduce) { v.pause(); } else { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      v.addEventListener('play', label); v.addEventListener('pause', label);
      btn.addEventListener('click', function () { if (v.paused) v.play(); else v.pause(); });
      label();
    });
    var mb = document.getElementById('marqBtn');
    if (mb) {
      var mq = mb.closest('.marq');
      mb.addEventListener('click', function () {
        var on = mq.classList.toggle('paused');
        mb.setAttribute('aria-pressed', on ? 'true' : 'false');
        mb.textContent = on ? 'Play' : 'Pause';
      });
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var vp = document.getElementById('marqViewport');
        vp.setAttribute('tabindex', '0'); vp.setAttribute('role', 'region'); vp.setAttribute('aria-label', 'Highlights, scrollable');
      }
    }
    if (!first) {
      window.scrollTo(0, 0);
      var t = document.getElementById('pageTitle'); (t || main).focus({ preventScroll: true });
    }
  }

  document.getElementById('contactLink').addEventListener('click', function (e) {
    e.preventDefault(); document.getElementById('contact').scrollIntoView();
  });
  window.addEventListener('hashchange', function () { render(false); });
  render(true);
})();
</script>
